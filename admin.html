
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaukriSetu Admin Panel</title>
  <meta name="robots" content="noindex, nofollow">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6f8;
      color: #263238;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .wrapper {
      max-width: 1100px;
      margin: auto;
    }

    h1, h2, h3 { margin-top: 0; }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
      margin-bottom: 22px;
    }

    .hidden { display: none !important; }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 15px;
      border: 1px solid #ccd5dc;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 8px;
    }

    button {
      border: 0;
      padding: 11px 17px;
      border-radius: 7px;
      background: #08796a;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin: 4px;
    }

    button:hover { opacity: .9; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    button.secondary { background: #64748b; }
    button.danger { background: #c0392b; }
    button.small { padding: 8px 12px; font-size: 13px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
    }

    .tabs button {
      background: #e5ecef;
      color: #263238;
    }

    .tabs button.active {
      background: #08796a;
      color: white;
    }

    .content-section { margin-top: 15px; }

    .job-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 16px;
      margin: 12px 0;
      border: 1px solid #e1e7eb;
      border-radius: 9px;
    }

    .job-card h3 { margin-bottom: 7px; }
    .job-card p { margin: 5px 0; color: #64748b; }

    .status {
      font-weight: bold;
      text-transform: capitalize;
    }

    .status.published { color: #08796a; }
    .status.draft { color: #b7791f; }
    .status.pending { color: #2563eb; }

    .summary {
      color: #64748b;
      margin-bottom: 15px;
    }

    .message {
      min-height: 20px;
      font-weight: 600;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .panel { padding: 16px; }
      .topbar { align-items: flex-start; }
      .tabs button { flex: 1 1 45%; }
    }
  </style>
</head>

<body>
<div class="wrapper">

  <!-- LOGIN -->
  <section id="loginBox" class="panel">
    <h1>NaukriSetu Admin Login</h1>
    <p>Login to manage website content.</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input type="email" id="loginEmail" required>

      <label>Password</label>
      <input type="password" id="loginPassword" required>

      <button type="submit" id="loginBtn">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </section>

  <!-- DASHBOARD -->
  <main id="dashboard" class="hidden">

    <div class="topbar">
      <div>
        <h1>NaukriSetu Admin Panel</h1>
        <p>Manage jobs, admit cards, results and answer keys.</p>
      </div>
      <button id="logoutBtn" class="danger">Logout</button>
    </div>

    <div class="tabs">
      <button type="button" class="active" data-tab="jobsSection">Government Jobs</button>
      <button type="button" data-tab="admitSection">Admit Cards</button>
      <button type="button" data-tab="resultsSection">Results</button>
      <button type="button" data-tab="answerSection">Answer Keys</button>
    </div>

    <!-- JOBS -->
    <section id="jobsSection" class="content-section panel">
      <h2 id="jobFormHeading">Add New Job</h2>

      <form id="jobForm">
        <input type="hidden" id="jobId">

        <label>Job Title *</label>
        <input id="title" required>

        <label>Department</label>
        <input id="department">

        <label>Qualification</label>
        <input id="qualification">

        <label>Location</label>
        <input id="location">

        <label>Total Posts</label>
        <input type="number" id="totalPosts" min="0">

        <label>Application Start Date</label>
        <input type="date" id="applicationStart">

        <label>Last Date</label>
        <input type="date" id="lastDate">

        <label>Official Website URL</label>
        <input type="url" id="officialUrl">

        <label>Notification PDF URL</label>
        <input type="url" id="notificationUrl">

        <label>Status</label>
        <select id="status">
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="published">Published</option>
        </select>

        <label>Job Description</label>
        <textarea id="description"></textarea>

        <button type="submit" id="saveJobBtn">Save Job</button>
        <button type="button" id="cancelJobEdit" class="secondary hidden">Cancel Edit</button>
        <p id="jobMessage" class="message"></p>
      </form>

      <hr>
      <h2>Manage Jobs</h2>
      <p id="jobSummary" class="summary"></p>
      <div id="jobsContainer"></div>
    </section>

    <!-- ADMIT CARDS -->
    <section id="admitSection" class="content-section panel hidden">
      <h2 id="admitFormHeading">Add New Admit Card</h2>

      <form id="admitForm">
        <input type="hidden" id="admitId">

        <label>Admit Card Title *</label>
        <input id="admitTitle" required>

        <label>Department</label>
        <input id="admitDepartment">

        <label>Exam Date</label>
        <input type="date" id="examDate">

        <label>Admit Card Download URL</label>
        <input type="url" id="downloadUrl">

        <label>Official Website URL</label>
        <input type="url" id="admitOfficialUrl">

        <label>Status</label>
        <select id="admitStatus">
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="published">Published</option>
        </select>

        <button type="submit" id="saveAdmitBtn">Save Admit Card</button>
        <button type="button" id="cancelAdmitEdit" class="secondary hidden">Cancel Edit</button>
        <p id="admitMessage" class="message"></p>
      </form>

      <hr>
      <h2>Manage Admit Cards</h2>
      <p id="admitSummary" class="summary"></p>
      <div id="admitContainer"></div>
    </section>

    <!-- RESULTS -->
    <section id="resultsSection" class="content-section panel hidden">
      <h2 id="resultFormHeading">Add New Result</h2>

      <form id="resultForm">
        <input type="hidden" id="resultId">

        <label>Result Title *</label>
        <input id="resultTitle" required>

        <label>Department</label>
        <input id="resultDepartment">

        <label>Result Date</label>
        <input type="date" id="resultDate">

        <label>Result Link</label>
        <input type="url" id="resultUrl">

        <label>Official Website URL</label>
        <input type="url" id="resultOfficialUrl">

        <label>Status</label>
        <select id="resultStatus">
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="published">Published</option>
        </select>

        <button type="submit" id="saveResultBtn">Save Result</button>
        <button type="button" id="cancelResultEdit" class="secondary hidden">Cancel Edit</button>
        <p id="resultMessage" class="message"></p>
      </form>

      <hr>
      <h2>Manage Results</h2>
      <p id="resultSummary" class="summary"></p>
      <div id="resultsContainer"></div>
    </section>

    <!-- ANSWER KEYS -->
    <section id="answerSection" class="content-section panel hidden">
      <h2 id="answerFormHeading">Add New Answer Key</h2>

      <form id="answerForm">
        <input type="hidden" id="answerId">

        <label>Answer Key Title *</label>
        <input id="answerTitle" required>

        <label>Department</label>
        <input id="answerDepartment">

        <label>Exam Date</label>
        <input type="date" id="answerExamDate">

        <label>Answer Key PDF / Download URL</label>
        <input type="url" id="answerKeyUrl">

        <label>Official Website URL</label>
        <input type="url" id="answerOfficialUrl">

        <label>Status</label>
        <select id="answerStatus">
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="published">Published</option>
        </select>

        <button type="submit" id="saveAnswerBtn">Save Answer Key</button>
        <button type="button" id="cancelAnswerEdit" class="secondary hidden">Cancel Edit</button>
        <p id="answerMessage" class="message"></p>
      </form>

      <hr>
      <h2>Manage Answer Keys</h2>
      <p id="answerSummary" class="summary"></p>
      <div id="answerContainer"></div>
    </section>

  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
